name: API Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-regression:
    name: API Regression & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Checkstyle, SpotBugs, and TestNG Test Suite
        run: mvn clean verify --batch-mode

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report --batch-mode

      - name: Upload Surefire and Execution Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-execution-artifacts
          path: |
            target/surefire-reports/
            logs/
            target/checkstyle-result.xml
            target/spotbugsXml.xml
          retention-days: 14

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 14
