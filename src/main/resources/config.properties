# Target API base URL (must be an absolute HTTP/HTTPS URL without userInfo, query, or fragment)
base.url=https://dummyjson.com

# Comma-separated list of permitted host names for exact matching (case-insensitive)
allowed.hosts=dummyjson.com,staging.dummyjson.com

# HTTP Client connection and socket timeout in seconds (allowed range: 1 to 300)
http.timeout.seconds=10

# Request and response body logging flag (disabled by default to protect payload confidentiality)
logging.include.body=false
